AWSTemplateFormatVersion: '2010-09-09'
Description: 'Model Optimization Workshop - Infrastructure Setup'

Parameters:
  NotebookInstanceType:
    Description: The EC2 instance type for the SageMaker notebook
    Type: String
    Default: ml.t3.medium
    AllowedValues:
      - ml.t3.medium
      - ml.t3.large
      - ml.t3.xlarge
      - ml.t3.2xlarge
      - ml.m5.xlarge
      - ml.m5.2xlarge
    ConstraintDescription: Must be a valid SageMaker instance type.

  OptimizationInstanceType:
    Description: The EC2 instance type for optimization processing jobs
    Type: String
    Default: ml.c5.xlarge
    AllowedValues:
      - ml.c5.xlarge
      - ml.c5.2xlarge
      - ml.g4dn.xlarge
      - ml.g4dn.2xlarge
    ConstraintDescription: Must be a valid SageMaker instance type.

  WorkshopName:
    Description: Name for the workshop resources (will be used in resource naming)
    Type: String
    Default: model-optimization-workshop
    AllowedPattern: "[a-zA-Z0-9-]+"
    ConstraintDescription: Must contain only alphanumeric characters and hyphens.

Resources:
  # S3 Bucket for workshop data
  WorkshopBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${WorkshopName}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  # IAM Role for SageMaker
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: WorkshopBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${WorkshopBucket}"
                  - !Sub "arn:aws:s3:::${WorkshopBucket}/*"
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # SageMaker Lifecycle Configuration - Simplified to avoid timeout
  NotebookLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Properties:
      OnStart:
        - Content:
            Fn::Base64: |
              #!/bin/bash
              set -e
              
              # Create workshop_config.py with the S3 bucket and role ARN
              cat > /home/ec2-user/SageMaker/workshop_config.py << EOL
              S3_BUCKET = "${WorkshopBucket.BucketName}"
              AWS_REGION = "${AWS::Region}"
              SAGEMAKER_ROLE_ARN = "${SageMakerExecutionRole.Arn}"
              OPTIMIZATION_INSTANCE_TYPE = "${OptimizationInstanceType}"
              EOL
              
              # Set proper permissions
              chown -R ec2-user:ec2-user /home/ec2-user/SageMaker/workshop_config.py
              
              # Create a welcome message with instructions
              cat > /home/ec2-user/SageMaker/welcome.md << EOL
              # Welcome to the Model Optimization Workshop!
              
              This notebook instance has been set up with the necessary AWS resources for the workshop.
              
              ## Getting Started
              
              1. Open a new terminal and run:
                 \`\`\`bash
                 cd SageMaker
                 git clone https://github.com/SaRedfiche/model-optimization-workshop.git
                 cd model-optimization-workshop
                 pip install -r requirements.txt
                 \`\`\`
              
              2. Open the first notebook: \`01_introduction_and_setup.ipynb\`
              
              ## Workshop Configuration
              
              The following resources have been created for you:
              - S3 Bucket: ${WorkshopBucket.BucketName}
              - AWS Region: ${AWS::Region}
              - SageMaker Role: ${SageMakerExecutionRole.Arn}
              - Optimization Instance Type: ${OptimizationInstanceType}
              
              These values are stored in \`workshop_config.py\` and will be automatically loaded by the notebooks.
              EOL
              
              # Set proper permissions
              chown -R ec2-user:ec2-user /home/ec2-user/SageMaker/welcome.md

  # SageMaker Notebook Instance
  NotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Sub "${WorkshopName}-notebook"
      InstanceType: !Ref NotebookInstanceType
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      LifecycleConfigName: !GetAtt NotebookLifecycleConfig.NotebookInstanceLifecycleConfigName
      VolumeSizeInGB: 50
      Tags:
        - Key: Name
          Value: !Sub "${WorkshopName}-notebook"
        - Key: Workshop
          Value: ModelOptimization

Outputs:
  NotebookInstanceId:
    Description: SageMaker Notebook Instance ID
    Value: !Ref NotebookInstance

  NotebookInstanceUrl:
    Description: URL to access the SageMaker Notebook Instance
    Value: !Sub "https://console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/notebook-instances/openNotebook/${NotebookInstance}?view=classic"

  WorkshopBucketName:
    Description: S3 Bucket for workshop data
    Value: !Ref WorkshopBucket

  SageMakerRoleArn:
    Description: IAM Role ARN for SageMaker
    Value: !GetAtt SageMakerExecutionRole.Arn
